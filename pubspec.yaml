# 十一 · 接着奏乐 —— 手机版（Android）
#
# 依赖策略：一个节点只加一个「功能」，加完单独验证一次。
#   N1：零依赖（只证明链路通）
#   N2：+ on_audio_query（读系统媒体库：曲名/歌手/时长）
#   N3：+ just_audio（前台播放：点歌出声 / 暂停 / 拖进度 / 上下曲）
#   N4：+ just_audio_background（后台播放 + 通知栏/锁屏控制）
#   N5：零新依赖（改用 just_audio 的新播放列表 API 装整库队列
#       → 通知栏上下曲 + 播完循环整库）
#   N6：+ shared_preferences（手机版第一个「往手机写数据」的节点）
#       评分 5 星 + 按星级排序
#   N7：零新依赖（搜索：纯 Dart 内存过滤 + 一个输入框）
#       ＋同轮清理：删掉 N6 的「导入电脑版星星」种子（非产品功能）
#   N8 起：视觉打磨。

name: shiyi_player
description: "十一 · 接着奏乐 —— 本地离线音乐播放器（Android）"
publish_to: 'none'
version: 0.7.0+8

environment:
  # 不写上界，兼容未来更高版本的 Dart
  sdk: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # N2：查询系统媒体库里的音频（自带权限申请，Android 12/13+ 分支已内置）
  on_audio_query: ^2.9.0

  # N3：前台播放器（基于 androidx.media3 / ExoPlayer）。
  #     支持 content:// URI 直读、进度跳转、播完自动下一首。
  just_audio: ^0.10.6

  # N4：后台播放 + 通知栏/锁屏控制。它是 N3 那个 AudioPlayer 的「外挂」——
  #     把 just_audio 接到系统音频会话上，不需要改播放逻辑本身。
  #
  #     为什么它需要单独一个节点验证（而不是和 N3 一起加）：
  #       · 它会向 manifest 注入 Service + Receiver + 3 条权限
  #       · 它要求 App 的启动 Activity 换成 AudioServiceActivity 的子类
  #       · 它会带来一条新的依赖链（audio_service → flutter_cache_manager → sqflite）
  #     这三件事任何一件出错，都会让「能装能开但一播就崩」或「通知栏不出现」。
  #
  #     ⚠️ 版本号 0.0.1-beta.NN 看似很久没更新，但已逐行核对：
  #        它与 just_audio 0.10.6 的 sdk/flutter/audio_session 约束完全一致，
  #        传递出来的 sqflite_android 也已自带 namespace（无需 CI 补丁）。
  just_audio_background: ^0.0.1-beta.17

  # N6：评分持久化。选它的理由：
  #   · 评分本质是「文件名 -> 星数」的扁平映射，键值存储天然匹配
  #   · flutter.dev 官方包，Android 24+ 起步（与本项目 minSdk 一致）
  #   · 已核对 shared_preferences_android 的 build.gradle.kts：
  #     namespace = io.flutter.plugins.sharedpreferences、
  #     compileSdk = flutter.compileSdkVersion、JVM_17 → AGP8 就绪，无需 CI 补丁
  #
  #   ⚠️ 用 SharedPreferencesAsync，**不要**用经典的 SharedPreferences ——
  #      官方已把后者标为 legacy（"will be deprecated"），并明确建议新用户改用 Async 版。
  #      本项目是「启动读一次 + 点星写一次」，Async 完全够，且不带本地缓存那套坑。
  #
  #   ⚠️ **不要**图省事直接 import sqflite —— 它虽然在 N4 带来的依赖链里
  #      （audio_service → flutter_cache_manager → sqflite），但那是**别人的传递依赖**：
  #      直接 import 属于隐式依赖，版本会随 audio_service 变动而失控。
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # N7：**没有 assets 了。**
  #     N6 曾在这里声明 assets/ratings_import.json（电脑版评分的种子），
  #     2026-09-23 经十一判定**该功能不该存在**（目标用户电脑上没有数据，
  #     且预置开发者私人数据方向就是错的）→ 连同文件与代码一并删除。
  #     详见 节点进度.md §二十二 / §二十三。
