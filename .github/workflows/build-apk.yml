# ============================================================================
#  十一 · 接着奏乐 —— 云端自动编译 APK
#
#  为什么走云端：本机不需要安装 Android Studio / SDK / JDK（省下 3GB+ 和一堆配置），
#  代码推上来，GitHub 的服务器替我们编译，编好直接下载 apk 装手机。
#
#  核心技巧：不手写 android/ 工程目录，而是让 CI 用「当前 Flutter 版本」自己生成
#  （flutter create）。这样 Gradle / AGP / Kotlin 版本永远和 Flutter 匹配，
#  不会被"手写模板版本过时"坑到。
#
#  各节点对应的工作流差异：
#    N1：只有骨架，不需要任何权限
#    N2：注入 READ_MEDIA_AUDIO（安卓 13+ 读音乐必需）+ 老插件 AGP8 兼容兜底
#    N3：摘掉 media3 带进来的 INTERNET 权限（只读本地，不联网）
#    N4：后台播放三件套（3 条权限 / AudioService+MediaButtonReceiver / Activity 换父类）
#    N5：工作流一行都不用改（整库队列是纯 Dart 的事，靠 just_audio 的 setAudioSources）
#    N6：+ assets/（评分种子）+ shared_preferences 依赖；工作流结构仍不用改
#        （步骤 9 的 flutter pub get 会自动拉新依赖，asset 由 pubspec 声明）
#    N7：搜索是纯 Dart 内存过滤，零新依赖，**构建逻辑不用改**；
#        但**第 11 步静态检查改了** —— 见该步骤处的详细说明：
#        作用域收窄到 `lib/` 且「error 即失败」（原先 `|| true` 非阻断，
#        语法/类型错误会溜到第 12 步真编译才炸，白烧约 1.5 分钟）。
#        另：N6 那套 assets 声明已删除（种子功能判定不该存在），
#        推送时会额外走一步「删除仓库里的旧种子文件」。
#    N8：视觉改版「深色潮玩」。**零新包依赖**（字体是 asset 不是包）；
#        新增 assets/fonts/（pubspec 的 fonts: 声明），其余构建逻辑不变。
# ============================================================================

name: 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 连续提交时，取消上一次还没跑完的构建，省时间
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. 安装 Flutter（stable）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 4. 显示版本
        run: flutter --version

      - name: 5. 生成 Android 工程目录（用当前 Flutter 版本，保证版本匹配）
        run: flutter create --org com.shiyi --project-name shiyi_player --platforms=android --no-pub .

      - name: 6. 校验 main.dart + 重置模板测试文件
        run: |
          if ! grep -q "SHIYI_PLAYER_" lib/main.dart; then
            echo "::error::lib/main.dart 被 flutter create 覆盖了！请检查第 5 步行为。"
            exit 1
          fi
          echo "✅ main.dart 完好，节点标记："
          grep -o "SHIYI_PLAYER_N[0-9]*" lib/main.dart | head -1

          # flutter create 发现 test/ 不存在时，会补一个引用模板类 MyApp 的 widget_test.dart。
          # 我们的 main.dart 里没有 MyApp —— flutter analyze 会报 creation_with_non_type。
          # 这里重置成不依赖任何业务类的冒烟测试。
          mkdir -p test
          printf '%s\n' \
            "import 'package:flutter_test/flutter_test.dart';" \
            "" \
            "void main() {" \
            "  test('smoke', () { expect(1 + 1, 2); });" \
            "}" > test/widget_test.dart
          echo "✅ test/widget_test.dart 已重置（无业务依赖）"

      - name: 7. 改应用名 + 注入音乐读取权限 + 摘掉联网权限
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          ls -l "$MF"

          # 应用显示名
          sed -i 's/android:label="[^"]*"/android:label="接着奏乐"/' "$MF"

          # 音乐读取权限：分 Android 版本写，缺一不可
          if ! grep -q "READ_MEDIA_AUDIO" "$MF"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n</manifest>|' "$MF"
          fi

          echo "--- 校验 ---"
          grep -q 'android:label="接着奏乐"' "$MF" \
            && echo "✅ 应用名 = 接着奏乐" \
            || { echo "::error::应用名替换失败"; exit 1; }
          grep -q "READ_MEDIA_AUDIO" "$MF" \
            && echo "✅ 已注入 READ_MEDIA_AUDIO" \
            || { echo "::error::音乐权限注入失败，装上也读不到歌"; exit 1; }
          grep -q "READ_EXTERNAL_STORAGE" "$MF" \
            && echo "✅ 已注入 READ_EXTERNAL_STORAGE (maxSdk=32)" \
            || echo "::warning::旧安卓兼容权限没注入（新机无影响）"

          # ---- N3：摘掉播放引擎带进来的「联网」权限 ----
          # just_audio 底层是 androidx.media3（ExoPlayer），media3 为了支持网络流媒体，
          # 在自己的 manifest 里声明了 android.permission.INTERNET。
          # 我们这个播放器只读本地 content://，全程不联网 —— 留着它，
          # 手机「应用信息 → 权限」里会出现网络相关条目，和「纯本地」的定位打架。
          # 用 manifest merger 的 remove 指令摘掉，最终 APK 里就没有这条。
          # 注：INTERNET 属普通权限、本来就不弹窗，这一步纯粹是为了权限列表干净。
          if ! grep -q 'xmlns:tools' "$MF"; then
            sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"|' "$MF"
          fi
          if ! grep -q 'permission.INTERNET' "$MF"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" tools:node="remove"/>\n</manifest>|' "$MF"
          fi

          echo "--- N3 校验 ---"
          grep -q 'xmlns:tools' "$MF" \
            && echo "✅ 已声明 tools 命名空间" \
            || { echo "::error::tools 命名空间没注入，remove 指令会被忽略"; exit 1; }
          grep -q 'permission.INTERNET' "$MF" \
            && echo "✅ 已声明移除 INTERNET 权限" \
            || { echo "::error::INTERNET 移除声明失败"; exit 1; }

          echo "--- 最终 manifest ---"
          cat "$MF"

      # ----------------------------------------------------------------------
      #  N4 = 后台播放，靠 just_audio_background（底层是 audio_service）。
      #  它在 Android 侧需要三样东西，缺任何一样都会「能装能开、但通知栏不出现」：
      #    ① 三条权限
      #    ② AudioService（前台服务）+ MediaButtonReceiver（耳机线控按键）
      #    ③ App 的启动 Activity 必须是 AudioServiceActivity 的子类
      # ----------------------------------------------------------------------
      - name: 7b. N4：后台播放 —— 注入 Service/Receiver/权限 + 改 Activity 父类
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          KT=$(find android/app/src/main/kotlin -name 'MainActivity.kt' | head -n1)

          # ---- ① 三条权限 ----
          #  WAKE_LOCK                          播放期间保持 CPU 唤醒（锁屏后不停）
          #  FOREGROUND_SERVICE                 允许起前台服务
          #  FOREGROUND_SERVICE_MEDIA_PLAYBACK  targetSdk>=34 必需，声明服务类型
          #  （三条都是普通权限，不弹窗；只有 POST_NOTIFICATIONS 才弹窗，
          #    而媒体会话通知豁免它，所以本节点不会新增任何权限弹窗）
          if ! grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$MF"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n</manifest>|' "$MF"
          fi

          # ---- ② Service + Receiver ----
          # tools:ignore="Instantiatable" 消掉 lint 的「类来自依赖库、无法实例化」告警。
          # xmlns:tools 在第 7 步（摘 INTERNET 时）已注入，这里直接用。
          if ! grep -q 'audioservice.AudioService' "$MF"; then
            sed -i 's|</application>|        <service android:name="com.ryanheise.audioservice.AudioService"\n            android:foregroundServiceType="mediaPlayback"\n            android:exported="true"\n            tools:ignore="Instantiatable">\n            <intent-filter>\n                <action android:name="android.media.browse.MediaBrowserService" />\n            </intent-filter>\n        </service>\n        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"\n            android:exported="true"\n            tools:ignore="Instantiatable">\n            <intent-filter>\n                <action android:name="android.intent.action.MEDIA_BUTTON" />\n            </intent-filter>\n        </receiver>\n</application>|' "$MF"
          fi

          # ---- ③ 启动 Activity 换成 AudioServiceActivity 的子类 ----
          # 官方 README 的做法是直接把 manifest 里 activity 的 android:name 改成
          # com.ryanheise.audioservice.AudioServiceActivity。**我们偏不那样做**：
          #   · 改 manifest  →  错到运行期才暴露（装到手机上才发现一开就崩）
          #   · 改 Kotlin 父类 → 错在编译期就暴露（构建那一步直接拦下）
          # 两者最终效果等价（MainActivity 仍是 AudioServiceActivity 的子类），
          # 但后者让错误提前。这是本轮刻意选的一条更稳的路。
          echo "MainActivity.kt: $KT"
          if [ -z "$KT" ]; then
            echo "::error::找不到 MainActivity.kt，第 5 步 flutter create 可能没生成"
            exit 1
          fi
          sed -i 's|import io.flutter.embedding.android.FlutterActivity|import com.ryanheise.audioservice.AudioServiceActivity|' "$KT"
          sed -i 's|: FlutterActivity()|: AudioServiceActivity()|' "$KT"

          echo "========== 改后：MainActivity.kt =========="
          cat "$KT"
          echo "========== 改后：manifest（第 7b 步结束后）=========="
          cat "$MF"

          # ---- 自检：任何一项没生效立刻失败 ----
          FAIL=0
          for P in WAKE_LOCK FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK; do
            if ! grep -q "android.permission.$P\"" "$MF"; then
              echo "::error::权限 $P 未注入"; FAIL=1
            fi
          done
          if ! grep -q 'com.ryanheise.audioservice.AudioService"' "$MF"; then
            echo "::error::AudioService 未注入"; FAIL=1
          fi
          if ! grep -q 'MediaButtonReceiver' "$MF"; then
            echo "::error::MediaButtonReceiver 未注入"; FAIL=1
          fi
          if ! grep -q 'foregroundServiceType="mediaPlayback"' "$MF"; then
            echo "::error::foregroundServiceType 未声明，targetSdk 34+ 起会拒绝启动该服务"; FAIL=1
          fi
          if ! grep -q 'AudioServiceActivity' "$KT"; then
            echo "::error::MainActivity 未改成 AudioServiceActivity 子类，通知栏不会出现"; FAIL=1
          fi
          if grep -q 'FlutterActivity' "$KT"; then
            echo "::error::MainActivity.kt 里还残留 FlutterActivity 引用"; FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "✅ N4 后台播放所需的 manifest / Activity 改造全部就位"

      # ----------------------------------------------------------------------
      #  🔴 N8.1 修复「每次升级星星全丢」：
      #  旧写法在第 8 步用 `if [ ! -f ~/.android/debug.keystore ]` 判断要不要生成，
      #  但 GitHub Actions 的构建机是一次性的 —— ~/.android 每次都为空，
      #  于是【每一轮构建都生成一把全新的随机 RSA 钥匙】。
      #  后果链：证书每轮都变 → 安卓拒绝覆盖安装（签名不符）→ 只能卸载重装
      #  → 卸载会清掉应用数据 → 评分（SharedPreferences）全部归零。
      #
      #  修复：仓库固化 sign/debug.keystore。有 → 直接用（签名从此稳定）；
      #  没有 → 生成一次，并把 keystore 作为产物吐出来，由人提交回仓库。
      #  debug keystore 提交进私有仓库是可接受的（它不是生产机密）。
      # ----------------------------------------------------------------------
      - name: 8. 签名（优先用仓库固化 keystore，保证跨构建稳定）
        run: |
          mkdir -p ~/.android
          if [ -f sign/debug.keystore ]; then
            cp sign/debug.keystore ~/.android/debug.keystore
            echo "✅ 使用仓库固化的 keystore —— 签名稳定，覆盖安装不丢数据"
          else
            echo "::warning::仓库里没有 sign/debug.keystore —— 本次签名是新生成的钥匙（与历史版本不兼容！）。请下载 signing-keystore 产物并提交为 sign/debug.keystore"
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore minted-debug.keystore
          fi
          echo "✅ 签名就绪"

      - name: 9. 拉取依赖
        run: flutter pub get

      # ----------------------------------------------------------------------
      #  老插件 on_audio_query_android 1.1.0 有两处硬伤，必须在这里打补丁。
      #  为什么在 CI 打而不是 fork：pub 缓存每次构建都是全新的，
      #  补丁写在这里才能保证每次构建产物一致、可复现。
      #
      #  硬伤①  AGP8 起 namespace 必填，且不再允许从 manifest 的 package 推导。
      #         插件只在 manifest 写了 package，build.gradle 里没有 namespace，
      #         构建直接死在 "Namespace not specified"。
      #  硬伤②  插件权限数组在安卓 13+ 上要 READ_MEDIA_IMAGES、12 及以下要
      #         WRITE_EXTERNAL_STORAGE，而它用 permissions.all{} 判断「全授才通过」。
      #         我们没声明这两项（一个音乐播放器也不该要相册权限），
      #         结果是权限永远返回「未授权」——App 能装能开，但永远卡在授权页。
      # ----------------------------------------------------------------------
      - name: 10. AGP8 + 权限 补丁（老插件两处硬伤）
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          PLUG=$(find "$CACHE/hosted/pub.dev" -maxdepth 1 -type d -name 'on_audio_query_android-*' | head -n1)
          if [ -z "$PLUG" ]; then
            echo "::error::pub-cache 里找不到 on_audio_query_android，补丁无法进行"
            exit 1
          fi
          echo "插件目录：$PLUG"

          BG="$PLUG/android/build.gradle"
          MF="$PLUG/android/src/main/AndroidManifest.xml"
          PK="$PLUG/android/src/main/kotlin/com/lucasjosino/on_audio_query/controllers/PermissionController.kt"

          echo "========== 补丁前：build.gradle =========="
          cat "$BG"

          # ---- 硬伤① 修复 ----
          #  ⚠️ 三件事必须写在同一次 sed 里，顺序可控：
          #    a) namespace：AGP8 必填，且不再允许从 manifest 的 package 推导
          #    b) compileOptions / kotlinOptions：插件的 Java 目标是 11（AGP 默认），
          #       而 Flutter 把 Kotlin 目标定在 17 → Gradle 直接报
          #       "Inconsistent JVM-target compatibility (11) vs (17)" 并中断。
          #       两边都显式对齐到 17。写法与 Flutter 自己生成的 app/build.gradle 一致，
          #       所以不担心 KGP 版本差异。
          if ! grep -q "namespace 'com.lucasjosino" "$BG"; then
            sed -i "s|^android {|android {\n    namespace 'com.lucasjosino.on_audio_query'\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = '17'\n    }|" "$BG"
          fi
          # 老式 xxxVersion 写法换成 AGP8 写法
          sed -i 's/compileSdkVersion *[0-9]\+/compileSdk 36/' "$BG"
          sed -i 's/minSdkVersion *[0-9]\+/minSdk 24/' "$BG"
          # 插件源码用到 ActivityCompat/ContextCompat，却没声明 androidx.core，补上防坑
          if ! grep -q 'androidx.core:core' "$BG"; then
            sed -i "s|^dependencies {|dependencies {\n    implementation 'androidx.core:core:1.13.1'|" "$BG"
          fi
          # manifest 里的 package 属性 AGP8 已移除支持，删掉
          sed -i 's/ *package="[^"]*"//' "$MF"

          # ---- 硬伤② 修复 ----
          # 删掉多余的两项权限，并把数组最后一行的尾逗号去掉（数组只剩一个元素）
          sed -i -e '/READ_MEDIA_IMAGES/d' \
                 -e 's/Manifest\.permission\.READ_MEDIA_AUDIO,$/Manifest.permission.READ_MEDIA_AUDIO/' "$PK"
          sed -i -e '/WRITE_EXTERNAL_STORAGE/d' \
                 -e 's/Manifest\.permission\.READ_EXTERNAL_STORAGE,$/Manifest.permission.READ_EXTERNAL_STORAGE/' "$PK"

          echo "========== 补丁后：build.gradle =========="
          cat "$BG"
          echo "========== 补丁后：权限数组 =========="
          sed -n '18,40p' "$PK"

          # ---- 自检：任何一项没生效就立刻失败，不浪费一轮构建 ----
          FAIL=0
          if ! grep -q "namespace 'com.lucasjosino.on_audio_query'" "$BG"; then echo "::error::namespace 未注入"; FAIL=1; fi
          if ! grep -q "JavaVersion.VERSION_17" "$BG"; then echo "::error::compileOptions 未注入（JVM 目标会不一致）"; FAIL=1; fi
          if ! grep -q "jvmTarget" "$BG"; then echo "::error::kotlinOptions.jvmTarget 未注入"; FAIL=1; fi
          if ! grep -q "compileSdk 36" "$BG"; then echo "::error::compileSdk 未替换"; FAIL=1; fi
          if ! grep -q "androidx.core:core" "$BG"; then echo "::error::androidx.core 未补上"; FAIL=1; fi
          if ! grep -q "READ_MEDIA_AUDIO" "$PK"; then echo "::error::READ_MEDIA_AUDIO 被误删"; FAIL=1; fi
          if ! grep -q "READ_EXTERNAL_STORAGE" "$PK"; then echo "::error::READ_EXTERNAL_STORAGE 被误删"; FAIL=1; fi
          if grep -q "READ_MEDIA_IMAGES" "$PK"; then echo "::error::READ_MEDIA_IMAGES 没删掉，安卓13+ 会永远卡授权页"; FAIL=1; fi
          if grep -q "WRITE_EXTERNAL_STORAGE" "$PK"; then echo "::error::WRITE_EXTERNAL_STORAGE 没删掉，安卓12- 会永远卡授权页"; FAIL=1; fi
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "✅ 两处硬伤均已修好"

      # 🔴 N7 调整（原先只有 `|| true`，等于「只提示、不阻断」，代价很实在）：
      #
      #   为什么改成「error 即失败」：
      #     `flutter analyze` 与第 12 步真正编译用的是**同一个分析器** ——
      #     它报 error，编译就**必然**失败。既然结果一样，就不该让它溜到
      #     第 12 步才炸：那一步要跑完 Gradle（约 2.5 分钟）才报错，
      #     而这一步约 1 分钟就能给同样的结论。
      #
      #   为什么作用域收窄到 `lib/`：
      #     release 构建只编译 lib/，**不编译 test/**。若对整个工程做 analyze，
      #     test/ 里的模板文件一旦有问题（CI 第 7 步会重置它）就会误杀
      #     本来能成功的构建。只查 lib/ ⇒ 判据与真实编译一致，零误杀。
      #
      #   `--no-fatal-infos --no-fatal-warnings` 保留 ⇒ info/warning 仍只是提示，
      #   只有 **error** 才让这一步失败。
      - name: 11. 静态检查（lib/ 报 error 即失败；info/warning 只提示）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: 12. 编译 release APK（全程留日志）
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: 13. 报告产物
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          echo "APK 大小：$(du -h "$APK" | cut -f1)"

      - name: 14. 上传 APK（构建完在页面上下载）
        uses: actions/upload-artifact@v4
        with:
          name: shiyi-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      # 关键兜底：把构建日志也当成产物传上去。
      # 这样即使本机打不开 github.com 网页、手里也没有 token，
      # 依然能通过产物通道把日志取下来排障。
      - name: 15. 上传构建日志（无论成败，便于离线排障）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30
          if-no-files-found: ignore

      # N8.1：若本次是「新生成钥匙」（仓库还没有固化 keystore），
      # 把它吐成产物，由人取回提交为 sign/debug.keystore。
      # 仓库里已有 keystore 时这个文件不存在 → if-no-files-found: ignore 静默跳过。
      - name: 15b. 上传本次生成的签名钥匙（如已固化则无此产物）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: minted-debug.keystore
          retention-days: 30
          if-no-files-found: ignore
